<head>

    <style>
        /* ========== 白蓝简约风格（完全保留） ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }

        body {
            background: linear-gradient(145deg, #f0f8ff 0%, #e3f0fa 100%);
            min-height: 100vh;
            padding: 2rem 1.5rem;
            display: flex;
            justify-content: center;
            color: #1a405c;
        }

        .cloud-container {
            max-width: 1300px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            box-shadow: 0 20px 40px -10px rgba(0, 80, 120, 0.15);
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .logo-text h1 {
            color: #0a558c;
            font-size: 2rem;
            font-weight: 600;
        }

        .logo-text span {
            background: #e1f0fd;
            padding: 5px 15px;
            border-radius: 30px;
            color: #0066aa;
            font-size: 14px;
        }

        .admin-access {
            background: white;
            padding: 10px 20px;

        .admin-badge {
            color: #1f6fd0;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .admin-btn, .exit-admin-btn {
            border: none;
            background: #eef5ff;
            padding: 8px 20px;
            border-radius: 30px;
            color: #1a5fb0;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .exit-admin-btn {
            background: #ffece5;
            color: #b0533a;
        }

        .sync-status {
            font-size: 12px;
            color: #5982a3;
            margin-left: 10px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .password-layer {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(42,125,225,0.2);

        .password-input {
            border: 1px solid #c2d9f0;
            border-radius: 40px;
            padding: 10px 20px;
            width: 210px;
            background: #fafcff;
        }

        .btn {
            border: 1px solid #e1ecfe;
            background: white;
            padding: 10px 25px;
            border-radius: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;

        .btn-primary {
            background: #2a7de1;
            border-color: #2a7de1;
            color: white;
        }

        .grid-folders {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            margin: 20px 0;
        }

        .folder-card {
            background: white;
            border-radius: 18px;
            padding: 20px 10px;
            border: 1px solid #e1f0fe;
            display: flex;
            flex-direction: column;

            cursor: pointer;

        .folder-card:hover {
            border-color: #2a7de1;

        .lock-tag {

            background: white;
            border-radius: 20px;

        .file-row {

        }

        .small-btn {
            background: white;
            border: 1px solid #2a7de1;

        .image-modal {
            display: none;

            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(12px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: transparent;
            border-radius: 32px;
            padding: 20px;
            max-width: 95vw;
            max-height: 95vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .modal-img {
            max-width: 95vw;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 16px;
            transition: transform 0.1s ease;
            cursor: zoom-in;
        }

        .modal-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;

            padding: 12px 24px;

        .modal-controls button {

            cursor: pointer;
            display: flex;
            align-items: center;

        .delete-folder-btn, .delete-file-btn {
            color: #b04a4a;
            background: none;
            border: none;
            padding: 5px 10px;

        }

        .footer-note {
            text-align: center;
            margin-top: 30px;
            color: #5982a3;

        .image-info {
            color: white;
            font-size: 12px;
            margin-top: 10px;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 20px;
        }

        .loading-skeleton {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        /* 缩略图样式 - 极小体积，云端只存这个！ */
        .instant-thumb {
            max-width: 48px;
            max-height: 48px;
            border-radius: 8px;
            object-fit: cover;
            margin-right: 10px;
            vertical-align: middle;
            background: #f0f8ff;
            border: 1px solid #d0e2f0;

        .recover-badge {
            background: #e6f7e6;
            color: #1e6b3b;
            border-radius: 16px;
            padding: 2px 12px;
            font-size: 11px;
            margin-left: 8px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        
        .recover-btn {
            background: none;
            border: 1px solid #2a7de1;
            padding: 5px 15px;
            border-radius: 30px;
            color: #1a5fb0;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            transition: 0.1s;
        }
        
        .recover-btn:hover {
            background: #e1f0fd;
        }

        /* 上传进度提示 */
        .upload-progress {
            font-size: 12px;
            color: #0a7b3c;
            margin-left: 12px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        @media (max-width: 600px) {
            .cloud-container { padding: 1.5rem; }
            .file-row { grid-template-columns: 2fr 1fr 2fr 0.8fr; }
            .password-layer { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>
<div class="cloud-container">

<script>
    // ========== JSONBin 配置 (云端只存缩略图！) ==========
    const BIN_ID = '698dc207d0ea881f40b4d2dc';
    const API_KEY = '$2a$10$AeBBV3QRbqxacd6sLjYM4uKZGElJz1vO91JUcn/Zn/wFBP3li/pq6';
    const ADMIN_PASSWORD = '100200';

    // ========== 全局变量 ==========
    let fileSystem = null;
    let currentPath = null;             
    let isAdmin = false;
    let pendingFolder = null;           
    let isCloudLoading = false;        

    // ★ 本地原图缓存（仅当前会话有效）
    const localOriginalCache = new Map(); // key: file.id, value: { base64, fileName, size }

    // ========== DOM 元素 ==========
    const currentViewEl = document.getElementById('currentView');
    const breadcrumbDiv = document.getElementById('breadcrumbDiv');
    const folderPassLayer = document.getElementById('folderPasswordLayer');
    const adminPanel = document.getElementById('adminPanelSection');
    const adminToggleSection = document.getElementById('adminToggleSection');
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImage');
    const imageInfo = document.getElementById('imageInfo');
    const resetButtonsContainer = document.getElementById('resetButtonsContainer');
    const syncStatus = document.getElementById('syncStatus');
    const lastUpdateTime = document.getElementById('lastUpdateTime');
    const skeletonLoader = document.getElementById('skeletonLoader');
    const uploadProgress = document.getElementById('uploadProgress');

    // ========== 纯云端数据操作方法 ==========
    async function loadFromCloud() {
        if (isCloudLoading) return fileSystem;
        isCloudLoading = true;
        try {
            console.log('[云盘] 从JSONBin加载缩略图数据...');
            const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            
            if (!response.ok) {
                throw new Error(`云端加载失败 (${response.status})`);
            }
            
            const data = await response.json();
            const record = data.record;
            if (!record || typeof record !== 'object') {
                throw new Error('无效的云端数据');
            }
            if (!record.folders) record.folders = [];
            if (!record.files) record.files = [];
            // 确保每个文件有唯一ID
            function ensureFileId(container) {
                if (container.files) {
                    container.files.forEach(f => {
                        if (!f.id) f.id = 'thumb_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
                    });
                }
                if (container.folders) {
                    container.folders.forEach(ensureFileId);
                }
            }
            ensureFileId(record);
            console.log('[云盘] 缩略图加载成功，根目录文件夹数:', record.folders.length);
            return record;
        } catch (e) {
            console.error('[云盘] 云端加载失败，使用默认初始结构', e);
            return getDefaultFileSystem();
        } finally {
            isCloudLoading = false;
        }
    }

    async function saveToCloud(data) {
        try {
            console.log('[云盘] 保存缩略图到JSONBin...');
            const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY
                },
                body: JSON.stringify(data)
            });
            
            if (!response.ok) {
                throw new Error(`云端保存失败 (${response.status})`);
            }
            console.log('[云盘] 缩略图保存成功');
            return true;
        } catch (e) {
            console.error('[云盘] 保存失败，请检查网络或JSONBin限额', e);
            alert('⚠️ 云端保存失败，请稍后重试。');
            return false;
        }
    }

    // ========== 默认数据 ==========
    function getDefaultFileSystem() {
        return {
            name: '根目录',
            folders: [
                { 
                    id: 'f1_' + Date.now(), 
                    name: '学习目录', 
                    password: '100000', 
                    files: [],
                    folders: []
                }
            ],
            files: []
        };
    }

    // ========== 保存文件系统 ==========
    async function saveFileSystem() {
        if (!fileSystem) return;
        await saveToCloud(fileSystem);
        if (lastUpdateTime) {
            const now = new Date();
            lastUpdateTime.innerText = `最后同步: ${now.toLocaleTimeString()}`;
        }
        updateStatsFromFileSystem();
    }

    // 更新统计（只计算缩略图大小）
    function updateStatsFromFileSystem() {
        if (!fileSystem) return;
        let totalSizeMB = 0;
        let imageCount = 0;
        
        function walk(container) {
            if (container.files) {
                container.files.forEach(f => {
                    if (f.type === 'image' && f.thumbnail) {
                        imageCount++;
                        totalSizeMB += (f.thumbnail.length * 0.75) / (1024 * 1024);
                    }
                });
            }
            if (container.folders) {
                container.folders.forEach(walk);
            }
        }
        walk(fileSystem);
        
        if (syncStatus) {
            syncStatus.innerHTML = `<i class="fas fa-database"></i> ${imageCount}张 | ${totalSizeMB.toFixed(2)}MB (缩略图)`;
        }
    }

    // ========== 获取当前容器 ==========
    function getCurrentContainer() {
        return currentPath[currentPath.length - 1];
    }

    // ========== 渲染视图 ==========
    async function render() {
        if (!fileSystem || !currentPath) return;

        // 管理员按钮状态
        if (isAdmin) {
            adminToggleSection.innerHTML = `<button class="exit-admin-btn" id="exitAdminBtn"><i class="fas fa-sign-out-alt"></i> 退出管理</button>`;
        } else {
            adminToggleSection.innerHTML = `<button class="admin-btn" id="loginAdminBtn"><i class="fas fa-lock-open"></i> 登录</button>`;
        }

        const loginBtn = document.getElementById('loginAdminBtn');
        if (loginBtn) loginBtn.onclick = adminLogin;
        const exitBtn = document.getElementById('exitAdminBtn');
        if (exitBtn) exitBtn.onclick = adminLogout;

        // 面包屑
        let breadHtml = '<span><i class="fas fa-location-dot"></i> ';
        for (let i = 0; i < currentPath.length; i++) {
            if (i > 0) breadHtml += ' <i class="fas fa-chevron-right" style="font-size: 12px;"></i> ';
            breadHtml += `<span class="clickable" data-index="${i}">${currentPath[i].ref.name || '云为E盘'}</span>`;
        }
        breadHtml += '</span>';
        breadcrumbDiv.innerHTML = breadHtml + '<span id="lastUpdateTime" style="font-size: 12px; color: #5982a3;"></span>';

        document.querySelectorAll('.clickable').forEach(el => {
            el.onclick = () => {
                const idx = parseInt(el.dataset.index);
                if (!isNaN(idx)) {
                    currentPath = currentPath.slice(0, idx + 1);
                    render();
                }
            };
        });

        const current = getCurrentContainer();

        // 密码验证
        if (current.type === 'folder' && current.ref.password && !current.unlocked && !isAdmin) {
            folderPassLayer.style.display = 'flex';
            currentViewEl.innerHTML = '';
            adminPanel.style.display = 'none';
            pendingFolder = current;
            return;
        } else {
            folderPassLayer.style.display = 'none';
            pendingFolder = null;
        }

        adminPanel.style.display = isAdmin ? 'block' : 'none';
        if (resetButtonsContainer) {
            resetButtonsContainer.style.display = isAdmin ? 'block' : 'none';
        }

        if (skeletonLoader) {
            skeletonLoader.style.display = 'none';
        }

        // 渲染文件夹 & 文件
        let html = '';

        if (current.ref.folders && current.ref.folders.length > 0) {
            html += '<div style="display: flex; align-items: center; gap: 8px; margin: 20px 0 10px;">';
            html += '<i class="fas fa-folder-open" style="color: #2a7de1;"></i>';
            html += '<h2 style="font-size: 1.3rem; color: #153e60;">文件夹</h2></div>';
            html += '<div class="grid-folders">';
            
            current.ref.folders.forEach(folder => {
                const lockIcon = folder.password ? `<span class="lock-tag"><i class="fas fa-lock"></i> 加密</span>` : '';
                const deleteBtn = isAdmin ? 
                    `<span class="admin-delete"><button class="delete-folder-btn" data-folder-id="${folder.id}"><i class="fas fa-trash-alt"></i></button></span>` : '';
                
                html += `<div class="folder-card" data-folder-id="${folder.id}">
                            ${deleteBtn}
                            <i class="fas fa-folder folder-icon"></i>
                            <div style="display: flex; align-items: center;">
                                <span style="font-weight: 500; color: #1c4c70;">${folder.name}</span>
                                ${lockIcon}
                            </div>
                        </div>`;
            });
            html += '</div>';
        }

        if (current.ref.files && current.ref.files.length > 0) {
            html += '<div style="display: flex; align-items: center; gap: 8px; margin-top: 30px;">';
            html += '<i class="fas fa-file-alt" style="color: #2a7de1;"></i>';
            html += '<h2 style="font-size: 1.3rem; color: #153e60;">图片（云端专业压缩≤100KB）</h2></div>';
            html += '<div class="file-table">';
            html += '<div class="file-row file-header"><span>缩略图/文件名</span><span>类型</span><span>本地恢复原图</span><span></span></div>';
            
            for (let i = 0; i < current.ref.files.length; i++) {
                const file = current.ref.files[i];
                let thumbHtml = '';
                
                if (file.thumbnail) {
                    thumbHtml = `<img src="${file.thumbnail}" class="instant-thumb" alt="缩略图" loading="lazy">`;
                }
                
                // 检查本地是否已恢复过原图
                const isCached = localOriginalCache.has(file.id);
                const cacheBadge = isCached ? `<span class="recover-badge"><i class="fas fa-check-circle"></i> 已恢复</span>` : '';
                
                // 恢复原图按钮
                const recoverBtn = `<button class="recover-btn" data-file-id="${file.id}" data-file-name="${file.name}">
                    <i class="fas fa-undo-alt"></i> ${isCached ? '查看原图' : '恢复原图'}
                </button>`;
                
                const deleteBtn = isAdmin ? 
                    `<button class="delete-file-btn" data-file-index="${i}"><i class="fas fa-trash-alt"></i></button>` : '';
                
                html += `<div class="file-row">
                            <span>${thumbHtml}<span style="margin-left: 5px;">${file.name}</span> ${cacheBadge}</span>
                            <span>图片</span>
                            <span>${recoverBtn}</span>
                            <span>${deleteBtn}</span>
                        </div>`;
            }
            html += '</div>';
        }

        if (!html) {
            html = '<div style="padding: 60px 20px; text-align: center; color: #5b83a3;">';
            html += '<i class="fas fa-folder-open" style="font-size: 50px;"></i>';
            html += '<p style="margin-top: 20px;">此文件夹为空</p>';
            html += '<p style="margin-top: 10px; font-size: 14px;">管理员登录后上传图片，专业压缩≤100KB，原图本地恢复</p>';
            html += '</div>';
        }

        currentViewEl.innerHTML = html;

        // 绑定文件夹点击
        document.querySelectorAll('.folder-card').forEach(el => {
            const delBtn = el.querySelector('.delete-folder-btn');
            if (delBtn) {
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteFolder(delBtn.dataset.folderId);
                };
            }
            
            el.onclick = (e) => {
                if (e.target.closest('.delete-folder-btn')) return;
                const folderId = el.dataset.folderId;
                const folder = current.ref.folders.find(f => f.id === folderId);
                if (folder) {
                    currentPath.push({ 
                        type: 'folder', 
                        ref: folder, 
                        unlocked: isAdmin ? true : false 
                    });
                    render();
                }
            };
        });

        // ★ 恢复原图按钮 —— 用户从本地选择原图 ★
        document.querySelectorAll('.recover-btn').forEach(btn => {
            btn.onclick = async (e) => {
                e.preventDefault();
                const fileId = btn.dataset.fileId;
                const fileName = btn.dataset.fileName;
                
                // 如果已经缓存过，直接显示
                if (localOriginalCache.has(fileId)) {
                    const cached = localOriginalCache.get(fileId);
                    window.smartViewer.show({
                        src: cached.base64,
                        fileName: cached.fileName + ' (本地缓存)'
                    });
                    return;
                }

                // 未缓存：用户从本地选择原图文件
                const fileInput = document.createElement('input');
                fileInput.type = 'file';
                fileInput.accept = 'image/*';
                fileInput.style.display = 'none';
                document.body.appendChild(fileInput);
                
                fileInput.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (!file) {
                        document.body.removeChild(fileInput);
                        return;
                    }
                    
                    const reader = new FileReader();
                    reader.onload = (loadEvent) => {
                        const base64 = loadEvent.target.result;
                        // 存入本地缓存
                        localOriginalCache.set(fileId, {
                            base64: base64,
                            fileName: fileName,
                            size: file.size
                        });
                        
                        window.smartViewer.show({
                            src: base64,
                            fileName: fileName + ' (本地恢复)'
                        });
                        
                        render();
                        document.body.removeChild(fileInput);
                    };
                    reader.readAsDataURL(file);
                };
                
                fileInput.click();
            };
        });

        // 绑定文件删除
        document.querySelectorAll('.delete-file-btn').forEach(btn => {
            btn.onclick = () => deleteFile(parseInt(btn.dataset.fileIndex));
        });

        updateStatsFromFileSystem();
    }

    // ========== 管理员登录/登出 ==========
    function adminLogin() {
        const pwd = prompt('请输入管理员密码', '');
        if (pwd === ADMIN_PASSWORD) {
            isAdmin = true;
            
            function unlockAll(container) {
                if (container.folders) {
                    container.folders.forEach(f => {
                        f.unlocked = true;
                        if (f.folders) unlockAll(f);
                    });
                }
            }
            unlockAll(fileSystem);
            render();
        } else {
            alert('密码错误');
        }
    }

    function adminLogout() {
        isAdmin = false;
        
        function lockAll(container) {
            if (container.folders) {
                container.folders.forEach(f => {
                    delete f.unlocked;
                    if (f.folders) lockAll(f);
                });
            }
        }
        lockAll(fileSystem);
        render();
    }

    async function deleteFolder(folderId) {
        if (!isAdmin) return;
        const current = getCurrentContainer();
        current.ref.folders = current.ref.folders.filter(f => f.id !== folderId);
        await saveFileSystem();
        render();
    }

    async function deleteFile(index) {
        if (!isAdmin) return;
        const current = getCurrentContainer();
        const file = current.ref.files[index];
        if (file && file.id) {
            localOriginalCache.delete(file.id);
        }
        current.ref.files.splice(index, 1);
        await saveFileSystem();
        render();
    }

    // ========== 🔥 专业压缩函数：browser-image-compression 🔥 ==========
    // 精准控制在100KB以内，同时保留最佳清晰度
    async function compressWithLibrary(file, maxSizeKB = 100, maxWidthOrHeight = 800) {
        const options = {
            maxSizeMB: maxSizeKB / 1024,        // 100KB = 0.0976MB，设为略低于100KB确保达标
            maxWidthOrHeight: maxWidthOrHeight,  // 限制最大尺寸，加快压缩
            useWebWorker: true,                  // 使用WebWorker加速
            fileType: 'image/jpeg',             // 统一输出JPEG，体积更小
            initialQuality: 0.85,               // 初始高质量，库会自动迭代
            alwaysKeepResolution: true          // 尽量保留分辨率，仅降低质量
        };

        try {
            // 专业库自动迭代压缩直到≤maxSizeMB
            const compressedFile = await imageCompression(file, options);
            
            // 将压缩后的File转为base64缩略图
            const base64 = await imageCompression.getDataUrlFromFile(compressedFile);
            
            // 验证实际大小（可选）
            const estimatedSizeKB = (base64.length * 0.75) / 1024;
            console.log(`[专业压缩] ${file.name} -> ${estimatedSizeKB.toFixed(2)}KB, 分辨率保持`);
            
            return base64;
        } catch (error) {
            console.error('[专业压缩] 压缩失败，回退Canvas方法', error);
            // 回退到Canvas压缩
            return fallbackCompress(file, maxSizeKB);
        }
    }

    // 回退方案：Canvas压缩（保证兼容性）
    async function fallbackCompress(file, maxSizeKB = 100) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    let width = img.width;
                    let height = img.height;
                    const maxDimension = 800;
                    if (width > maxDimension || height > maxDimension) {
                        if (width > height) {
                            height = Math.floor(height * (maxDimension / width));
                            width = maxDimension;
                        } else {
                            width = Math.floor(width * (maxDimension / height));
                            height = maxDimension;
                        }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    let quality = 0.8;
                    let result = canvas.toDataURL('image/jpeg', quality);
                    let estimatedSizeKB = (result.length * 0.75) / 1024;
                    
                    while (estimatedSizeKB > maxSizeKB && quality > 0.2) {
                        quality -= 0.1;
                        result = canvas.toDataURL('image/jpeg', quality);
                        estimatedSizeKB = (result.length * 0.75) / 1024;
                    }
                    resolve(result);
                };
                img.onerror = reject;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    // ========== 上传图片：云端只存专业压缩缩略图（≤100KB） ==========
    document.getElementById('uploadFileBtn').onclick = async () => {
        if (!isAdmin) { alert('请先登录管理员'); return; }
        
        const input = document.getElementById('fileUploadInput');
        if (input.files.length === 0) { alert('请选择图片文件'); return; }
        
        const files = Array.from(input.files);
        if (files.length > 3) {
            alert('一次最多上传3张图片');
            return;
        }

        const current = getCurrentContainer();
        if (!current.ref.files) current.ref.files = [];
        
        let successCount = 0;
        let failCount = 0;
        
        const uploadBtn = document.getElementById('uploadFileBtn');
        uploadBtn.disabled = true;
        uploadBtn.style.opacity = '0.5';
        uploadProgress.style.display = 'inline-flex';
        
        try {
            for (const originalFile of files) {
                if (!originalFile.type.startsWith('image/')) {
                    alert('只能上传图片文件');
                    continue;
                }
                try {
                    // 🔥 使用专业压缩库生成缩略图（≤100KB，清晰度最优）
                    const thumbnail = await compressWithLibrary(originalFile, 100, 800);
                    
                    const fileId = 'thumb_' + Date.now() + '_' + Math.random().toString(36).substr(2, 10);
                    
                    // 云端仅存储缩略图，绝不存原图
                    current.ref.files.push({
                        id: fileId,
                        name: originalFile.name,
                        type: 'image',
                        thumbnail: thumbnail,
                        size: originalFile.size,
                        uploadTime: Date.now()
                    });
                    
                    successCount++;
                    await saveFileSystem(); // 每次上传后保存，避免丢失
                } catch (e) {
                    console.error('上传失败:', originalFile.name, e);
                    failCount++;
                }
            }
        } finally {
            uploadBtn.disabled = false;
            uploadBtn.style.opacity = '1';
            uploadProgress.style.display = 'none';
            input.value = '';
        }
        
        render();
        alert(`✅ 专业压缩完成: ${successCount}成功, ${failCount}失败\n云端仅存储≤100KB缩略图，画质保留最佳`);
    };

    // ========== 重置与默认 ==========
    document.getElementById('clearStorageBtn').onclick = async () => {
        if (!isAdmin) { alert('请先登录管理员'); return; }
        if (confirm('⚠️ 确定要彻底清除云端所有数据吗？\n此操作不可恢复！')) {
            fileSystem = getDefaultFileSystem();
            currentPath = [{ type: 'root', ref: fileSystem }];
            isAdmin = false;
            localOriginalCache.clear();
            await saveToCloud(fileSystem);
            render();
            alert('云盘已重置为初始状态');
        }
    };

    document.getElementById('softResetBtn').onclick = async () => {
        if (!isAdmin) { alert('请先登录管理员'); return; }
        if (confirm('恢复默认文件夹会删除所有当前数据，确定吗？')) {
            fileSystem = getDefaultFileSystem();
            currentPath = [{ type: 'root', ref: fileSystem }];
            isAdmin = false;
            localOriginalCache.clear();
            await saveToCloud(fileSystem);
            render();
            alert('已恢复默认文件夹');
        }
    };

    // ========== 智能图片查看器 ==========
    class SmartImageViewer {
        constructor(modal, modalImg, imageInfo) {
            this.modal = modal;
            this.modalImg = modalImg;
            this.imageInfo = imageInfo;
            this.currentZoom = 1;
            this.currentFileName = '';
            
            document.getElementById('zoomInBtn').onclick = () => this.zoom(0.2);
            document.getElementById('zoomOutBtn').onclick = () => this.zoom(-0.2);
            document.getElementById('resetZoomBtn').onclick = () => this.resetZoom();
            document.getElementById('closeModalBtn').onclick = () => this.close();
            document.getElementById('downloadImageBtn').onclick = () => this.download();
            
            modalImg.ondblclick = () => this.resetZoom();
            modalImg.onwheel = (e) => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? -0.1 : 0.1;
                this.zoom(delta);
            };
            modal.onclick = (e) => {
                if (e.target === modal) this.close();
            };
        }
        
        show({ src, fileName }) {
            this.currentFileName = fileName || 'image.jpg';
            this.currentZoom = 1;
            this.modalImg.src = src;
            this.modalImg.style.transform = 'scale(1)';
            this.modal.style.display = 'flex';
            this.imageInfo.innerText = `${fileName} · 本地临时缓存（刷新即释放）`;
        }
        
        zoom(delta) {
            this.currentZoom = Math.min(Math.max(this.currentZoom + delta, 0.5), 3);
            this.modalImg.style.transform = `scale(${this.currentZoom})`;
            this.modalImg.style.cursor = this.currentZoom > 1 ? 'zoom-out' : 'zoom-in';
        }
        
        resetZoom() {
            this.currentZoom = 1;
            this.modalImg.style.transform = 'scale(1)';
            this.modalImg.style.cursor = 'zoom-in';
        }
        
        close() {
            this.modal.style.display = 'none';
            this.modalImg.src = '';
        }
        
        download() {
            if (this.modalImg.src) {
                const link = document.createElement('a');
                link.href = this.modalImg.src;
                link.download = this.currentFileName;
                link.click();
            }
        }
    }

    // ========== 绑定事件（除上传按钮已在前面定义） ==========
    function bindEvents() {
        document.getElementById('submitFolderPassBtn').onclick = () => {
            const pass = document.getElementById('folderPassInput').value;
            if (pendingFolder && pendingFolder.ref.password === pass) {
                pendingFolder.unlocked = true;
                render();
            } else {
                alert('密码错误');
            }
            document.getElementById('folderPassInput').value = '';
        };

        document.getElementById('cancelFolderPassBtn').onclick = () => {
            if (currentPath.length > 1) currentPath.pop();
            render();
        };

        document.getElementById('createFolderBtn').onclick = async () => {
            if (!isAdmin) { alert('请先登录管理员'); return; }
            const name = document.getElementById('newFolderName').value.trim();
            if (!name) { alert('请输入文件夹名称'); return; }
            const pwd = document.getElementById('newFolderPwd').value.trim() || '';
            
            const current = getCurrentContainer();
            if (!current.ref.folders) current.ref.folders = [];
            
            const newFolder = {
                id: 'f' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                name: name,
                password: pwd,
                files: [],
                folders: []
            };
            
            current.ref.folders.push(newFolder);
            await saveFileSystem();
            
            document.getElementById('newFolderName').value = '';
            document.getElementById('newFolderPwd').value = '';
            render();
        };
    }

    // ========== 初始化 ==========
    async function init() {
        window.smartViewer = new SmartImageViewer(modal, modalImg, imageInfo);
        
        if (skeletonLoader) skeletonLoader.style.display = 'block';
        
        const cloudData = await loadFromCloud();
        fileSystem = cloudData;
        
        currentPath = [{ type: 'root', ref: fileSystem }];
        
        await render();
        
        bindEvents();
        
        if (lastUpdateTime) {
            lastUpdateTime.innerText = `最后同步: ${new Date().toLocaleTimeString()}`;
        }
    }

    window.addEventListener('load', init);
</script>
